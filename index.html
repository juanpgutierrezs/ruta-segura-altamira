<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruta Segura Altamira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --navy:#12305a; --navy2:#1c4680; --ink:#1d2433; --muted:#5d6779; --line:#e3e7ee; --bg:#f4f6fa; --card:#fff;
  --red:#d63b3b; --redbg:#fde8e8; --amber:#e9a100; --amberbg:#fff4d6; --green:#1f9d55; --greenbg:#e2f6ea;
  --accent:#ff7a1a; --blue:#2f6fde; --bluebg:#e7efff; --r:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
button,select,input,textarea{font:inherit}
header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:14px 20px 0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:.2px}
.logo .lights{display:flex;flex-direction:column;gap:2px;background:#0b1d38;padding:4px 5px;border-radius:7px}
.logo .lights i{width:9px;height:9px;border-radius:50%;display:block}
.logo small{display:block;font-weight:600;font-size:12px;opacity:.75;letter-spacing:.3px}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.who select{background:#ffffff1a;color:#fff;border:1px solid #ffffff40;border-radius:9px;padding:6px 8px}
.who select option{color:var(--ink)}
.mypts{background:var(--accent);color:#fff;font-weight:800;border-radius:999px;padding:5px 12px;white-space:nowrap}
nav{max-width:1180px;margin:12px auto 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:#ffffffc8;text-decoration:none;padding:10px 13px;border-radius:10px 10px 0 0;font-weight:700;font-size:14px;white-space:nowrap}
nav a:hover{color:#fff;background:#ffffff14}
nav a.on{background:var(--bg);color:var(--navy)}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:26px;margin:0 0 4px;font-weight:900;color:var(--navy)}
h2{font-size:18px;margin:0 0 12px;font-weight:800;color:var(--navy)}
h3{font-size:15px;margin:0 0 6px;font-weight:800}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.banner{background:linear-gradient(120deg,#fff,#fff7ef);border:1px solid #ffd9b8;border-radius:var(--r);padding:18px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.banner b{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}
.p-red{background:var(--redbg);color:var(--red)} .p-amber{background:var(--amberbg);color:#9a6a00} .p-green{background:var(--greenbg);color:var(--green)}
.p-blue{background:var(--bluebg);color:var(--blue)} .p-gray{background:#eef0f4;color:var(--muted)} .p-or{background:#ffeedd;color:#c25400}
.kpi .v{font-size:28px;font-weight:900;color:var(--navy);line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted);font-weight:700}
.kpi .m{font-size:12px;margin-top:6px}
.bar{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.ok{color:var(--green);font-weight:800} .warn{color:#b07800;font-weight:800}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--navy);color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn.or{background:var(--accent)} .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)} .btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.me td{background:#fff7ef}
.pos{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:#9aa3b2}
.pos.m1{background:#e0a800}.pos.m2{background:#8f9bab}
label{font-weight:700;font-size:13px;display:block;margin:12px 0 5px}
select.f,input.f,textarea.f{width:100%;border:1px solid #cfd6e1;border-radius:10px;padding:10px;background:#fff}
textarea.f{min-height:80px;resize:vertical}
.types{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.type{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;background:#fff}
.type.on{border-color:var(--accent);background:#fff7ef}
.type small{display:block;color:var(--muted);font-size:12px}
.type b.pt{color:var(--accent);font-size:16px;white-space:nowrap}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:#fff}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.crit{border-color:#f3b9b9;background:#fff6f6}
.steps{display:flex;gap:4px;margin:8px 0}
.steps span{flex:1;font-size:11px;font-weight:800;text-align:center;padding:5px 2px;border-radius:6px;background:#eef0f4;color:#8a93a3}
.steps span.done{background:var(--greenbg);color:var(--green)}
.steps span.cur{background:var(--bluebg);color:var(--blue)}
.rep{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;margin-bottom:10px}
.rep .meta{font-size:12px;color:var(--muted)}
.resp{background:#f3f7ff;border-left:3px solid var(--blue);padding:8px 10px;border-radius:6px;font-size:13px;margin-top:8px}
.mapwrap{display:grid;grid-template-columns:1fr 340px;gap:16px}
@media (max-width:900px){.mapwrap{grid-template-columns:1fr}}
svg.map{width:100%;height:auto;background:#fbfcfe;border-radius:12px;border:1px solid var(--line)}
.dot{cursor:pointer}
.dot:hover circle.c{stroke-width:4}
@keyframes pulse{0%{r:13;opacity:.55}100%{r:24;opacity:0}}
.pulse{animation:pulse 1.6s ease-out infinite}
.crow{display:flex;justify-content:space-between;font-size:13px;margin-top:6px}
.cbar{display:flex;gap:3px;margin-top:3px}.cbar i{flex:1;height:7px;border-radius:3px;background:#e8ebf1}
.legend{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.lg{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px}
.lg .sw{width:16px;height:16px;border-radius:50%;flex:none;margin-top:2px}
.prize{text-align:center;padding:22px 16px}
.prize .ico{font-size:40px}
.prize .lvl{font-weight:900;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.prize h3{font-size:18px;margin:6px 0}
.wall{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.note{background:#fffbe6;border:1px solid #f2e2a2;border-radius:12px;padding:14px;position:relative}
.note .by{font-size:12px;font-weight:800;color:#8a6d00;margin-top:8px}
.qrgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.qrc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:12px}
.qrc .q svg{width:120px;height:120px}
.qrc .bandc{height:6px;border-radius:4px;margin-bottom:8px}
.toast{opacity:0;position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px #0003;transition:.3s;z-index:50;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cycle{display:flex;gap:6px;align-items:center;font-size:13px;color:#ffffffd0}
.login{max-width:960px;margin:30px auto;display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
@media (max-width:820px){.login{grid-template-columns:1fr}}
.login .hero{display:flex;flex-direction:column;justify-content:center;background:linear-gradient(140deg,var(--navy),var(--navy2));color:#fff;border-radius:var(--r);padding:28px}
.login .hero h1{color:#fff;font-size:28px}
.login .hero li{margin:8px 0}
.err{color:var(--red);font-weight:700;font-size:13px;min-height:18px;margin-top:8px}
.demo{background:#f6f8fc;border:1px dashed #c4cddb;border-radius:12px;padding:12px;margin-top:16px;font-size:13px}
.demo button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:4px 6px 0 0;cursor:pointer;font-weight:700;font-size:12px}
.userchip{display:flex;align-items:center;gap:8px;background:#ffffff1a;border:1px solid #ffffff30;border-radius:999px;padding:4px 6px 4px 12px}
.userchip button{background:#ffffff26;color:#fff;border:0;border-radius:999px;padding:4px 10px;cursor:pointer;font-weight:700;font-size:12px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:30px}
.lvlrow td:first-child{font-weight:800}
.hint{font-size:12px;color:var(--muted)}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.badge{display:inline-block;background:var(--greenbg);color:var(--green);font-weight:800;font-size:11px;padding:2px 8px;border-radius:99px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo"><span class="lights"><i style="background:#ff5a5a"></i><i style="background:#ffc233"></i><i style="background:#3ccf7a"></i></span>
      <div>Ruta Segura Altamira<small>Colegio Altamira School · Cultura preventiva SST</small></div></div>
    <div class="who">
      <span class="cycle">Trimestre 1 · Reto 01 de 3</span>
      <span class="userchip" id="userChip"></span>
      <span class="mypts" id="myPts">0 pts</span>
    </div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
/* ===================== DATOS BASE ===================== */
const ART_URL = "https://claude.ai/artifact/5HpD3wFAFSL6q5M4oKsEKx";
// En un hosting propio, los QR usan automáticamente la dirección de esa página.
const BASE_URL = (location.protocol==="https:"&&!/claude|anthropic|usercontent/i.test(location.hostname))
  ? location.origin+location.pathname : ART_URL; // link público del prototipo (para los QR)
const ROUTES = [
  ["inicio","Inicio"],["reto","Reto actual"],["reportar","Reportar"],["mapa","Semáforo"],
  ["seguimiento","Seguimiento"],["puntos","Puntos"],["ranking","Ranking"],["recompensas","Recompensas"],
  ["mejoras","Muro de mejoras"],["qr","Accesos QR"]
];
const TYPES = [
  {id:"cond", name:"Condición insegura", pts:2, lvl:"Participación", d:"Peldaño roto, pasamanos flojo, cable en el piso"},
  {id:"sup", name:"Superficie peligrosa", pts:3, lvl:"Participación", d:"Piso mojado, desnivel, superficie resbalosa"},
  {id:"caida", name:"Caída o casi-caída propia", pts:3, lvl:"Aprendizaje", d:"Reportar no tiene castigo: nos ayuda a aprender"},
  {id:"obs", name:"Situación de riesgo observada", pts:5, lvl:"Cuidado colectivo", d:"Sin nombres. Ej.: bajar con celular o con carga"},
  {id:"mej", name:"Propuesta de mejora", pts:7, lvl:"Contribución", d:"Tu idea puede cambiar el estándar del colegio"}
];
const STATUS = ["Recibido","En revisión","En corrección","Cerrado"];
const COLOR = {
  rojo:{n:"Rojo",zone:"Escaleras",c:"var(--red)",bg:"var(--redbg)",hex:"#d63b3b",cls:"p-red",risk:"Riesgo alto · caída a distinto nivel",
    msg:"La prisa puede hacerte llegar rápido… pero también hacerte caer.",
    doc:"Pausa. Usa el pasamanos. Sin carga ni celular.", col:"Toda condición reportada se corrige con prioridad, en máximo 30 días.",
    floor:"Cinta antideslizante roja en el borde de cada escalón."},
  amarillo:{n:"Amarillo",zone:"Rampas",c:"var(--amber)",bg:"var(--amberbg)",hex:"#e9a100",cls:"p-amber",risk:"Riesgo medio",
    msg:"No tienes que llegar primero. Tienes que llegar seguro.",
    doc:"Precaución y manos libres.", col:"Mejora programada y seguimiento.",
    floor:"Franjas transversales amarillas cada 1,5 m."},
  verde:{n:"Verde",zone:"Pasillos",c:"var(--green)",bg:"var(--greenbg)",hex:"#1f9d55",cls:"p-green",risk:"Riesgo bajo · caída a nivel",
    msg:"Avanza, pero sin prisa.",
    doc:"Avanza, pero sin prisa.", col:"Mantenimiento y monitoreo.",
    floor:"Sin cinta: placa suspendida y placa QR."}
};
const hid = id => id.replace("-","").toLowerCase();

const POINTS0 = [
  {id:"E-01",z:"rojo",name:"Escalera principal Bloque B",x:452,y:150},
  {id:"E-02",z:"rojo",name:"Escalera de emergencia Bloque B",x:610,y:104},
  {id:"E-03",z:"rojo",name:"Escalera Bloque C (laboratorios)",x:742,y:170},
  {id:"E-04",z:"rojo",name:"Escalones patio – coliseo",x:560,y:330},
  {id:"E-05",z:"rojo",name:"Graderías del coliseo",x:680,y:420},
  {id:"R-01",z:"amarillo",name:"Rampa Bloque A",x:150,y:192},
  {id:"R-02",z:"amarillo",name:"Rampa de acceso a cafetería",x:258,y:378},
  {id:"R-03",z:"amarillo",name:"Rampa sala de profesores",x:372,y:262},
  {id:"R-04",z:"amarillo",name:"Rampa acceso administración",x:110,y:440},
  {id:"P-01",z:"verde",name:"Corredor Bloque A",x:96,y:120},
  {id:"P-02",z:"verde",name:"Pasillo de laboratorios",x:690,y:226},
  {id:"P-03",z:"verde",name:"Patio central",x:420,y:352},
  {id:"P-04",z:"verde",name:"Corredor Bloque B (baños)",x:520,y:216},
  {id:"P-05",z:"verde",name:"Biblioteca",x:300,y:120},
  {id:"P-06",z:"verde",name:"Parqueadero docentes",x:70,y:352}
];

const PEOPLE0 = {
  mat:[["Jorge Martínez",24],["Sandra Ortiz",19],["Felipe Rojas",15]],
  cie:[["Luis Fernández",22],["Paola Herrera",18]],
  hum:[["Camila Torres",17]], ing:[["Diana Castro",14]], art:[["Andrés Gil",12]], pri:[["Rosa Méndez",20]]
};
const nkey = n => n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
function seedPeople(){const o={};for(const a in PEOPLE0){o[a]={};PEOPLE0[a].forEach(([n,p])=>o[a][nkey(n)]={name:n,pts:p});}return o;}
const AREAS0 = [
  {id:"mat",name:"Matemáticas",total:20,part:18,pts:295,closed:5},
  {id:"cie",name:"Ciencias",total:22,part:17,pts:320,closed:6},
  {id:"hum",name:"Humanidades",total:25,part:15,pts:300,closed:4},
  {id:"ing",name:"Inglés",total:17,part:12,pts:202,closed:3},
  {id:"art",name:"Artes y Ed. Física",total:15,part:13,pts:185,closed:4},
  {id:"pri",name:"Primaria",total:30,part:23,pts:355,closed:7}
];

const REPORTS0 = [
  {id:"R-001",name:"Jorge Martínez",type:"cond",point:"E-01",area:"mat",anon:false,desc:"Peldaño 4 desportillado en la escalera principal.",status:3,resp:"Peldaño reparado y cinta antideslizante instalada. Gracias por reportar.",days:3,mine:false},
  {id:"R-002",name:"Paola Herrera",type:"sup",point:"P-02",area:"cie",anon:false,desc:"Piso mojado por limpieza justo en el cambio de clase.",status:2,resp:"Se ajusta el horario de limpieza y se instala señal portátil.",days:2,mine:false},
  {id:"R-003",name:"Luis Fernández",type:"mej",point:"E-04",area:"cie",anon:false,desc:"Instalar pasamanos en los escalones del patio al coliseo.",status:3,resp:"Mejora aprobada e implementada. Autoría: Área de Ciencias.",days:4,mine:false},
  {id:"R-004",type:"caida",point:"R-02",area:"pri",anon:true,desc:"Casi caída bajando la rampa con cuadernos en ambas manos.",status:1,resp:"SST revisa la pendiente y la superficie de la rampa.",days:1,mine:false},
  {id:"R-005",type:"obs",point:"E-02",area:"hum",anon:true,desc:"Varias personas bajan usando el celular en la escalera de emergencia.",status:3,resp:"Señal roja «Manos libres, sin celular» instalada. Tema incluido en el Reto 02.",days:2,mine:false},
  {id:"R-006",name:"Diana Castro",type:"cond",point:"E-03",area:"ing",anon:false,desc:"Cinta antideslizante despegada en dos escalones de la escalera de laboratorios.",status:0,resp:"",days:null,mine:false}
];

const MEJORAS0 = [
  {t:"Pasamanos en los escalones patio – coliseo",by:"Área de Ciencias",fx:"Escalones patio – coliseo con pasamanos a ambos lados."},
  {t:"Carrito para transportar material entre bloques",by:"Área de Primaria",fx:"Menos carga en escaleras y rampas."},
  {t:"Limpieza de pisos fuera del cambio de clase",by:"Área de Matemáticas",fx:"Pasillo de laboratorios sin piso mojado en horas pico."},
  {t:"Bandejas de entrega de cuadernos en cada bloque",by:"Área de Humanidades",fx:"Los docentes suben con las manos libres."}
];

/* ===================== CUENTAS POR ÁREA (demo) =====================
   Cada área tiene un usuario y un PIN. SST los entrega al coordinador de área y los renueva cada trimestre.
   No se usa el correo institucional: los estudiantes también lo tienen. */
const ACCOUNTS = [
  {code:"matematicas",pin:"4821",area:"mat"},
  {code:"ciencias",pin:"3967",area:"cie"},
  {code:"humanidades",pin:"5140",area:"hum"},
  {code:"ingles",pin:"2753",area:"ing"},
  {code:"artes",pin:"6308",area:"art"},
  {code:"primaria",pin:"1592",area:"pri"}
];
const acc = code => ACCOUNTS.find(a=>a.code===code);
let fails=0, lockUntil=0;

/* ===================== ESTADO ===================== */
const KEY="rutaSeguraAltamira_v7";
function fresh(){return {me:null,area:"cie",users:{},
  points:JSON.parse(JSON.stringify(POINTS0)),areas:JSON.parse(JSON.stringify(AREAS0)),
  reports:JSON.parse(JSON.stringify(REPORTS0)),people:seedPeople(),mejoras:JSON.parse(JSON.stringify(MEJORAS0)),seq:7,blocked:{}};}
let S; try{S=JSON.parse(localStorage.getItem(KEY))||fresh();}catch(e){S=fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s);
const area=id=>S.areas.find(a=>a.id===id);
function U(){if(!S.users)S.users={};return S.users[S.me]||(S.users[S.me]={joined:false,myPts:0,hist:[],reto:[false,false,false,false],retoDone:false});}
const point=id=>S.points.find(p=>p.id===id);
const typ=id=>TYPES.find(t=>t.id===id);
const pct=(a,b)=>b?Math.round(a/b*100):0;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),3200);}
function addPts(n,why,name){
  const a=area(S.area);
  U().myPts+=n;a.pts+=n;U().hist.unshift({n,why:name?why+" · "+name:why});
  if(name){S.people=S.people||seedPeople();const P=S.people[S.area]=S.people[S.area]||{},k=nkey(name);(P[k]=P[k]||{name,pts:0}).pts+=n;}
  save();renderHeader();
}
function validName(n){return n.split(" ").length>=2&&n.length>=6&&!/\d/.test(n);}

/* ===================== HEADER ===================== */
function renderHeader(){
  const who=document.querySelector(".who");
  if(!S.me){who.style.display="none";$("#nav").innerHTML="";return;}
  who.style.display="";
  const u=acc(S.me);
  $("#userChip").innerHTML=`👥 Área de ${area(u.area).name}<button id="logout">Salir</button>`;
  $("#logout").onclick=()=>{S.me=null;save();toast("Sesión cerrada.");render();};
  $("#myPts").textContent=U().myPts+" pts";
  const r=current().base;
  $("#nav").innerHTML=ROUTES.map(([h,n])=>`<a href="#${h}" class="${h===r?"on":""}">${n}</a>`).join("");
}

/* ===================== KPIs ===================== */
function kpis(){
  const tp=S.areas.reduce((a,x)=>a+x.part,0), tt=S.areas.reduce((a,x)=>a+x.total,0);
  const R=S.reports, resp=R.filter(r=>r.days!==null&&r.days<=5).length, closed=R.filter(r=>r.status===3).length;
  const RR=R.filter(r=>point(r.point).z==="rojo"), RRc=RR.filter(r=>r.status===3).length;
  return [
    {l:"Participación en la plataforma",v:pct(tp,tt),m:70,u:"%",f:`${tp} de ${tt} docentes`},

}
function vQR(){
  const ok=BASE_URL.startsWith("http");
  return `<h1>Accesos QR</h1><p class="sub">Cada punto crítico tiene su QR. Al escanearlo, el docente abre el formulario con la ubicación ya cargada. Se imprimen y laminan (15 × COP 20.000).</p>
  <div class="card" style="margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <div class="q" style="width:130px">${ok?qrSVG(BASE_URL):""}</div>
    <div><h3>QR general de la plataforma</h3><p class="hint" style="margin:0">Para el tablero de la sala de profesores y la cartelera.</p></div></div>
  <div class="qrgrid">${S.points.map(p=>{const c=COLOR[p.z];return `<div class="qrc"><div class="bandc" style="background:${c.hex}"></div>
    <div class="q">${ok?qrSVG(BASE_URL+"#reportar-"+hid(p.id)):""}</div>
    <b>${p.id} · ${p.name}</b><div style="color:${c.c};font-weight:800">${c.n}: ${c.doc}</div>
    <a href="#reportar-${hid(p.id)}">Probar enlace</a></div>`}).join("")}</div>`;
}

function vLogin(){
  const c=current(), dest=c.pt?`Al ingresar irás directo a reportar en ${c.pt} · ${point(c.pt).name}.`:"";
  return `<div class="login">
    <div class="hero">
      <div style="font-size:13px;font-weight:800;letter-spacing:.5px;opacity:.8">ACCESO EXCLUSIVO PARA PERSONAL</div>
      <h1>Ruta Segura Altamira</h1>
      <p style="opacity:.9">Plataforma de reporte y prevención de caídas para docentes y personal del colegio.</p>
    </div>
    <form class="card" id="loginForm" autocomplete="off">
      <h2>Iniciar sesión</h2>
      ${dest?`<div class="resp" style="margin-bottom:6px">📍 ${dest}</div>`:""}
      <label for="lgCode">Usuario del área</label>
      <input class="f" id="lgCode" placeholder="Ej.: ciencias" maxlength="40" autocapitalize="none">
      <label for="lgPin">PIN</label>
      <input class="f" id="lgPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
      <div class="err" id="lgErr"></div>
      <button class="btn or" type="submit" style="width:100%;margin-top:6px">Ingresar</button>
      <p class="hint" style="margin-top:12px">¿No tienes el usuario o el PIN de tu área? Pídelo a tu coordinador de área o a SST.</p>
      <div class="demo"><b>Cuentas de demostración</b> (prototipo):<br>
        ${ACCOUNTS.map(a=>`<button type="button" data-demo="${a.code}">${a.code} · PIN ${a.pin}</button>`).join("")}
      </div>
    </form>
  </div>`;
}
function bindLogin(){
  document.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>{const a=acc(b.dataset.demo);$("#lgCode").value=a.code;$("#lgPin").value=a.pin;});
  $("#loginForm").onsubmit=e=>{
    e.preventDefault();
    const err=$("#lgErr"), now=Date.now();
    if(now<lockUntil){err.textContent=`Demasiados intentos. Espera ${Math.ceil((lockUntil-now)/1000)} s.`;return;}
    const code=$("#lgCode").value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""), pin=$("#lgPin").value.trim(), a=acc(code);
    if(/@/.test(code)){err.textContent="Usa el usuario de tu área, no el correo institucional.";return;}
    if(!a||a.pin!==pin){fails++;
      if(fails>=3){lockUntil=now+30000;fails=0;err.textContent="Usuario o PIN incorrectos. Acceso bloqueado 30 s.";}
      else err.textContent=`Usuario o PIN incorrectos. Intento ${fails} de 3.`;
      return;}
    fails=0;S.me=a.code;S.area=a.area;U();save();
    toast(`Bienvenidos, área de ${area(a.area).name}.`);render();
  };
}

/* ===================== RUTEO ===================== */
function current(){
  const h=(location.hash||"#inicio").slice(1);
  const m=h.match(/^reportar-([erp]\d\d)$/);
  if(m)return {base:"reportar",pt:m[1][0].toUpperCase()+"-"+m[1].slice(1)};
  return {base:ROUTES.some(r=>r[0]===h)?h:"inicio"};
}
function render(){
  renderHeader();
  const c=current(), v=$("#view");
  if(!S.me||!acc(S.me)){S.me=null;v.innerHTML=vLogin()+`<div class="foot">Prototipo académico · Ruta Segura Altamira · Cultura de Seguridad y Talento Humano (CUC)</div>`;bindLogin();return;}
  const map={inicio:vInicio,reto:vReto,reportar:()=>vReportar(c.pt),mapa:vMapa,seguimiento:vSeguimiento,puntos:vPuntos,ranking:vRanking,recompensas:vRecompensas,mejoras:vMejoras,qr:vQR};
  v.innerHTML=map[c.base]()+`<div class="foot">Prototipo académico · Ruta Segura Altamira · Cultura de Seguridad y Talento Humano (CUC) · Datos de demostración
   · <a href="#" id="reset">Reiniciar demo</a></div>`;
  bind(c);
}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);});

/* ===================== EVENTOS ===================== */
function bind(c){
  const rs=$("#reset");
  rs.onclick=e=>{e.preventDefault();if(rs.dataset.arm){S=fresh();save();toast("Demo reiniciada.");render();}else{rs.dataset.arm=1;rs.textContent="¿Seguro? Toca otra vez para reiniciar";}};
  if(c.base==="reto"){
    document.querySelectorAll("[data-step]").forEach(cb=>cb.onchange=()=>{U().reto[+cb.dataset.step]=cb.checked;save();render();});
    const b=$("#retoBtn"); if(b)b.onclick=()=>{const nm=$("#rtName").value.trim().replace(/\s+/g," ");if(!validName(nm)){toast("Escribe tu nombre completo: nombres y apellidos.");$("#rtName").focus();return;}U().retoDone=true;addPts(1,"Reto 01 completado",nm);toast("¡Reto completado! +1 punto para "+area(S.area).name);render();};
  }
  if(c.base==="reportar"){
    let tsel="cond";
    document.querySelectorAll(".type").forEach(el=>el.onclick=()=>{document.querySelectorAll(".type").forEach(x=>x.classList.remove("on"));el.classList.add("on");tsel=el.dataset.type;});
    $("#repForm").onsubmit=e=>{
      e.preventDefault();
      const name=$("#rpName").value.trim().replace(/\s+/g," ");
      if(!validName(name)){toast("Escribe tu nombre completo: nombres y apellidos.");$("#rpName").focus();return;}
      const desc=$("#rpDesc").value.trim();
      if(desc.length<8){toast("Describe un poco más lo que viste (mínimo 8 caracteres).");$("#rpDesc").focus();return;}
      const t=typ(tsel), id="R-"+String(S.seq++).padStart(3,"0"), crit=$("#rpCrit").checked, pt=$("#rpPoint").value;
      S.reports.unshift({id,type:tsel,point:pt,area:S.area,anon:$("#rpAnon").checked,name,desc,status:0,resp:"",days:null,by:S.me,crit});
      if(crit)S.blocked[pt]=true;
      const key=name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""), ar=area(S.area);
      S.names=S.names||{}; S.names[S.area]=S.names[S.area]||[];
      if(!S.names[S.area].includes(key)&&!((S.people||{})[S.area]||{})[nkey(name)]){S.names[S.area].push(key); if(ar.part<ar.total)ar.part++;}
      addPts(t.pts,`${t.name} (${id})`,name);
      toast(`Reporte ${id} recibido. +${t.pts} puntos. Te avisaremos cada avance.`);
      location.hash="#seguimiento";
    };
  }
  if(c.base==="mapa"){
    document.querySelectorAll("[data-pt]").forEach(g=>g.onclick=()=>{selPt=g.dataset.pt;render();});
  }
  if(c.base==="seguimiento"){
    document.querySelectorAll("[data-adv]").forEach(b=>b.onclick=()=>{
      const r=S.reports.find(x=>x.id===b.dataset.adv); r.status++;
      const msgs=["","SST recibió tu reporte y hará verificación en sitio esta semana.","Verificado. Mantenimiento programó la corrección.","Corrección terminada y verificada por SST. ¡Gracias por reportar!"];
      if(r.days===null)r.days=2; r.resp=msgs[r.status];
      if(r.status===3){
        area(r.area).closed++;
        if(S.blocked[r.point])delete S.blocked[r.point];
        if(r.type==="mej"){
          r.resp="Tu propuesta fue aprobada e implementada. Ya aparece en el Muro de mejoras con tu autoría.";
          S.mejoras.unshift({t:r.desc,by:r.anon?"Docente (nombre reservado) · Área de "+area(r.area).name:"Área de "+area(r.area).name,fx:"Implementada en "+point(r.point).name+"."});
          if(r.by===S.me)addPts(10,`Mejora implementada (${r.id})`,r.name);
          toast("Mejora implementada: +10 puntos y autoría visible.");
        } else toast(`Reporte ${r.id} cerrado. El ciclo de la voz se completó.`);
      }
      save();render();
    });
  }
}
render();
</script>
</body>
